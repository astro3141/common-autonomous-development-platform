# #281 option B: the routing layer's own egress. The ONLY way out of cadp278-governed for model
# traffic once the Preloop gateway is no longer the model path. CONNECT to 443 only, and only to
# the provider hosts in /etc/tinyproxy/allow; everything else is refused and logged.
User tinyproxy
Group tinyproxy
Port 8888
Listen 0.0.0.0
Timeout 600
LogLevel Connect
MaxClients 50
ConnectPort 443
Filter "/etc/tinyproxy/allow"
FilterType ere
FilterDefaultDeny Yes
FilterURLs Off
DisableViaHeader Yes

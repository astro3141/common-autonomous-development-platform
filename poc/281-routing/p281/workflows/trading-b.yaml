# Capability trial B — can this stack run a trading-shaped cycle?
#
# Shape taken from the paper-trading harness (Notion): several lanes decide from one frozen packet
# in the same cycle, a deterministic lane runs beside the model lanes, every proposal is validated
# the same way (universe, weights, gross, grounding), a failing lane is isolated, and the cycle
# ends in a comparison. Nothing of that project is imported: the packet is a fixture with invented
# numbers, and no market data or external API is touched — this stack's egress reaches providers
# only.
#
#   conductor run p281/workflows/trading-b.yaml -i profile=research-default
workflow:
  name: p281-trading-b
  description: Multi-lane cycle on a frozen packet with deterministic validation (capability trial)
  entry_point: route
  input:
    profile:
      type: string
      required: false
      default: research-default
      description: execution profile (config/profiles/<name>.yaml)
    lane2_login:
      type: string
      required: false
      default: ""
      description: override the second AI lane's login (a missing one exercises lane isolation)
  limits:
    max_iterations: 20
    timeout_seconds: 2400

agents:
  - name: route
    type: script
    description: Quota admission for the cycle
    command: "${POC_PY:-/opt/venv/bin/python}"
    args: ["/work/p281/steps/route.py", "{{ workflow.input.profile }}"]
    output:
      decision: {type: string}
      provider: {type: string}
      reason: {type: string}
      profile: {type: string}
      evidence_dir: {type: string}
    routes:
      - to: roles
        when: "{{ route.output.decision == 'ROUTE' }}"
      - to: record_hold

  - name: roles
    type: script
    description: Bind each model lane to a vendor of its own
    command: "${POC_PY:-/opt/venv/bin/python}"
    args: ["/work/p281/steps/roles.py", "{{ route.output.profile }}", "{{ route.output.evidence_dir }}",
           "ai=codex", "ai2=claude"]
    output:
      ok: {type: string}
      missing: {type: string}
      ineligible: {type: string}
      ai_provider: {type: string}
      ai_login: {type: string}
      ai_route: {type: string}
      ai2_provider: {type: string}
      ai2_login: {type: string}
      ai2_route: {type: string}
    routes:
      - to: packet
        when: "{{ roles.output.ok == 'yes' }}"
      - to: record_hold

  - name: packet
    type: script
    description: Freeze the cycle's input packet (built twice, hashes compared)
    command: "${POC_PY:-/opt/venv/bin/python}"
    args: ["/work/p281/steps/trade_stage.py", "packet"]
    output:
      status: {type: string}
      workspace: {type: string}
      packet_sha256: {type: string}
      deterministic: {type: string}
      symbols: {type: number}
    routes:
      - to: lanes

  - name: lanes
    type: script
    description: One deterministic lane and two model lanes, decided at the same time
    command: "${POC_PY:-/opt/venv/bin/python}"
    args: ["/work/p281/steps/trade_lanes.py", "{{ route.output.profile }}",
           "base:deterministic:none:none:none:none",
           "ai:model:{{ roles.output.ai_provider }}:{{ roles.output.ai_login }}:{{ roles.output.ai_route }}:/work/p281/prompts/trade-lane.md",
           "ai2:model:{{ roles.output.ai2_provider }}:{{ workflow.input.lane2_login or roles.output.ai2_login }}:{{ roles.output.ai2_route }}:/work/p281/prompts/trade-lane2.md"]
    timeout: 900
    output:
      status: {type: string}
      lanes: {type: number}
      produced: {type: number}
      failed: {type: string}
      model_calls: {type: number}
      wall_s: {type: number}
      busy_s: {type: number}
      overlap: {type: number}
      detail: {type: string}
    routes:
      - to: evaluate

  - name: evaluate
    type: script
    description: Validate every lane the same way and score them against held-back returns
    command: "${POC_PY:-/opt/venv/bin/python}"
    args: ["/work/p281/steps/trade_stage.py", "evaluate"]
    output:
      status: {type: string}
      lanes: {type: number}
      valid: {type: number}
      invalid: {type: string}
      best_lane: {type: string}
      best_ret: {type: string}
      packet_sha256: {type: string}
      report: {type: string}
    routes:
      - to: record_cycle

  - name: record_cycle
    type: script
    description: Record the cycle (never fails the workflow)
    command: "${POC_PY:-/opt/venv/bin/python}"
    args: ["/work/p281/steps/record.py"]
    stdin: "{{ {'execute': {'provider': roles.output.ai_provider, 'model_route': roles.output.ai_route, 'run_id': packet.output.packet_sha256[:12], 'status': 'COMPLETED', 'model_session_reported': '', 'model_adapter_reported': '', 'model_served': 'unknown', 'evidence_dir': route.output.evidence_dir, 'measurements': {'valid_lanes': evaluate.output.valid, 'model_calls': lanes.output.model_calls, 'lane_wall_s': lanes.output.wall_s}}, 'check': {'decision': 'CYCLE', 'reason': 'best ' + evaluate.output.best_lane + ' ret ' + evaluate.output.best_ret, 'file_sha256': evaluate.output.packet_sha256}, 'route': route.output} | tojson }}"
    output:
      mlflow_run_id: {type: string}
      experiment_id: {type: string}
      record_error: {type: string}
    routes:
      - to: done_cycle
        when: "{{ evaluate.output.valid > 0 }}"
      - to: done_no_lane

  - name: record_hold
    type: script
    description: Record a cycle the router held
    command: "${POC_PY:-/opt/venv/bin/python}"
    args: ["/work/p281/steps/record.py"]
    stdin: "{{ {'route': route.output} | tojson }}"
    output:
      mlflow_run_id: {type: string}
      experiment_id: {type: string}
      record_error: {type: string}
    routes:
      - to: done_hold

  - name: done_cycle
    type: terminate
    status: success
    reason: "CYCLE: {{ evaluate.output.valid }}/{{ evaluate.output.lanes }} lanes valid, best {{ evaluate.output.best_lane }}"

  - name: done_no_lane
    type: terminate
    status: failed
    reason: "no lane produced a valid proposal (invalid: {{ evaluate.output.invalid }})"

  - name: done_hold
    type: terminate
    status: failed
    reason: "HOLD: {{ route.output.reason }} {{ roles.output.missing }} {{ roles.output.ineligible }}"

output:
  profile: "{{ route.output.profile }}"
  route: "{{ route.output.decision }}: {{ route.output.reason }}"
  lanes: "{% if evaluate is defined %}{{ evaluate.output.lanes }}{% endif %}"
  valid: "{% if evaluate is defined %}{{ evaluate.output.valid }}{% endif %}"
  invalid: "{% if evaluate is defined %}{{ evaluate.output.invalid }}{% endif %}"
  failed_lanes: "{% if lanes is defined %}{{ lanes.output.failed }}{% endif %}"
  best_lane: "{% if evaluate is defined %}{{ evaluate.output.best_lane }}{% endif %}"
  best_ret: "{% if evaluate is defined %}{{ evaluate.output.best_ret }}{% endif %}"
  packet_sha256: "{% if packet is defined %}{{ packet.output.packet_sha256 }}{% endif %}"
  packet_deterministic: "{% if packet is defined %}{{ packet.output.deterministic }}{% endif %}"
  model_calls: "{% if lanes is defined %}{{ lanes.output.model_calls }}{% endif %}"
  lane_overlap: "{% if lanes is defined %}{{ lanes.output.overlap }}{% endif %}"
  report: "{% if evaluate is defined %}{{ evaluate.output.report }}{% endif %}"
  mlflow_run_id: "{% if record_cycle is defined %}{{ record_cycle.output.mlflow_run_id }}{% elif record_hold is defined %}{{ record_hold.output.mlflow_run_id }}{% endif %}"
  record_error: "{% if record_cycle is defined %}{{ record_cycle.output.record_error }}{% elif record_hold is defined %}{{ record_hold.output.record_error }}{% endif %}"

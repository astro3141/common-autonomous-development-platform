# Baseline policy: the governed tool is allowed. Used for the PASS path of the
# vertical slice. N1 swaps this for policy/n1-deny.yaml.
version: '1.0'
metadata:
  name: cadp278-allow
  description: Baseline — write_marker permitted
mcp_servers:
- name: cadp278-toolsvc
  url: http://cadp278-toolsvc:8000/mcp
  transport: http-streaming
  auth_type: none
tools:
- name: write_marker
  source: cadp278-toolsvc
  enabled: true
- name: list_markers
  source: cadp278-toolsvc
  enabled: true
defaults:
  unknown_tools: allow
  require_approval_for_new_tools: false
  inherit_from_parent: true

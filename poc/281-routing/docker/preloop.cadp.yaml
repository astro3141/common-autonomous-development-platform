# Attaches Preloop's api / console / gateway to the PoC networks, with the aliases the agent
# resolves. Replaces the out-of-band `docker network connect` step, which did not survive a
# restart or recreate of the Preloop containers. Used as an extra compose file on top of the
# upstream Preloop install (~/.preloop-oss): see scripts/up.sh.
#
# `default` is listed explicitly because naming any network replaces a service's implicit one.
# The PoC networks are created by compose.poc.yaml, so the PoC stack comes up first.
#
# STACK and the port variables default to the live instance. A restored copy runs beside it under
# another name and other ports (scripts/restore.sh), which is how a restore is verified without
# touching the instance in use.
services:
  api:
    networks:
      default: {}
      ${STACK:-cadp278}-governed:
        aliases: [api]
      ${STACK:-cadp278}-toolnet:
        aliases: [api]
    ports:
      - "${PRELOOP_API_PORT:-8000}:8000"
  console:
    networks:
      default: {}
      ${STACK:-cadp278}-governed:
        aliases: [console]
    ports:
      - "${PRELOOP_CONSOLE_PORT:-3000}:80"
  gateway:
    networks:
      default: {}
      ${STACK:-cadp278}-governed:
        aliases: [gateway]
    ports:
      - "${PRELOOP_GATEWAY_PORT:-8001}:8000"

networks:
  ${STACK:-cadp278}-governed:
    external: true
  ${STACK:-cadp278}-toolnet:
    external: true

# CADP external verification backend (#57).
#
# Authority boundary (issue #57): GitHub Actions is an EVIDENCE SOURCE, never a lifecycle
# authority. A green check here transitions nothing by itself — the broker reads the check-run
# result for the exact candidate sha, the activity submits it as VERIFICATION evidence produced
# by `verifier:github-actions`, and the deployment policy decides sufficiency
# (`require_external_verification`). Workers get no GitHub credentials for this: the workflow is
# repository-owned and triggers on the governed candidate-branch push that already happened.
name: cadp-verify
on:
  push:
    branches:
      - "cadp/candidate/**"
jobs:
  verify:
    name: cadp-verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      # The conformance suite drives a real OPA evaluator; pin the SAME version the deployment's
      # evaluator integrity records (1.20.1). Without it the suite stalls to the job timeout
      # (measured live, 16th pilot: npm test cancelled at 10m, check-run conclusion=cancelled).
      - run: |
          curl -fsSL -o /usr/local/bin/opa https://openpolicyagent.org/downloads/v1.20.1/opa_linux_amd64_static
          chmod +x /usr/local/bin/opa
          opa version
      - run: npm ci --ignore-scripts
      # PROTECTED INVOCATION. The external verifier's test seam is pinned HERE, in this
      # gate-protected workflow, and no longer reached through the `npm test` script: package.json
      # is an ordinary, delegable file, so a candidate that could edit it could change what the
      # verifier executes without ever touching gate machinery. `npm test` survives only as a
      # developer convenience. This invocation is byte-identical to the LOCAL verifier's argv
      # (`VERIFIER_TEST_ARGV` in cadp/product/surfaceBroker.ts; the two sites are asserted equal by
      # the GF8 control), and both dirs — cadp/tests/conformance/ and cadp/tests/ops/ — plus
      # devharness/tests/ keep running here: the split changed protection, never coverage.
      #
      # WHY BARE, with no positional selectors: `node --test` discovers *.test.ts recursively from
      # the working directory. Naming the leaf directories positionally was MEASURED BROKEN on the
      # container runtime (node:22): `node --test cadp/tests/conformance/` does not enumerate a
      # directory's .ts files, it runs the directory as ONE FAILING PSEUDO-TEST and executes zero
      # real tests. Revisit only on a re-measurement, not on assumption.
      #
      # ZERO-TEST GUARD: a run that discovers NOTHING prints `# tests 0` and EXITS 0 (measured on
      # Node 22 — node's own exit code does NOT fail a zero-file run), so the summary count is
      # asserted explicitly. A verifier that executed nothing must never report a green check.
      - run: |
          set -o pipefail
          node --test 2>&1 | tee node-test-output.log
          grep -qE '^[[:space:]]*# tests [1-9][0-9]*$' node-test-output.log \
            || { echo "cadp-verify: the pinned invocation executed ZERO tests (or printed no summary) — failing closed"; exit 1; }
        shell: bash

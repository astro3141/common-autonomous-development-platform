# CADP external verification backend (#57).
#
# Authority boundary (issue #57): GitHub Actions is an EVIDENCE SOURCE, never a lifecycle
# authority. A green check here transitions nothing by itself — the broker reads the check-run
# result for the exact candidate sha, the activity submits it as VERIFICATION evidence produced
# by `verifier:github-actions`, and the deployment policy decides sufficiency
# (`require_external_verification`). Workers get no GitHub credentials for this: the workflow is
# repository-owned and triggers on the governed candidate-branch push that already happened.
name: cadp-verify
on:
  push:
    branches:
      - "cadp/candidate/**"
jobs:
  verify:
    name: cadp-verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      # The conformance suite drives a real OPA evaluator; pin the SAME version the deployment's
      # evaluator integrity records (1.20.1). Without it the suite stalls to the job timeout
      # (measured live, 16th pilot: npm test cancelled at 10m, check-run conclusion=cancelled).
      - run: |
          curl -fsSL -o /usr/local/bin/opa https://openpolicyagent.org/downloads/v1.20.1/opa_linux_amd64_static
          chmod +x /usr/local/bin/opa
          opa version
      - run: npm ci --ignore-scripts
      # Zero-discovery guard — the external verifier's half of the same protection the local
      # verifier gets from `parseExecutedTestCount()` in `cadp/product/surfaceBroker.ts`.
      #
      # MEASURED (Node v22.23.2, the surface image's runtime): a `node --test` run that discovers
      # NO test files prints `# tests 0` and EXITS 0. Exit status alone therefore cannot tell "the
      # suite passed" from "nothing ran". This job pins Node 24, on which that exit-status
      # behaviour is UNMEASURED here — the assertion below deliberately does not depend on it: it
      # reads the runner's own summary, which is the same TAP line on both runtimes.
      #
      # NOTE ON THE SEAM: `package.json`'s `test` script stays as a developer convenience. Both
      # verifiers are meant to spawn the runner directly with an explicit, protected test-path
      # enumeration so the executed set cannot be re-pointed by editing that script. That
      # narrowing is NOT yet applied at either site: on Node 22 `node --test <dir>/` resolves a
      # directory argument as a module entry point rather than expanding it, so the routed
      # `node --test cadp/tests/conformance/ cadp/tests/ops/ devharness/tests/` executes zero
      # tests on the surface image (see the same note in `surfaceBroker.ts`). Until that is
      # re-routed, the guard below is what stops a silently-empty run from reading as a pass.
      - run: |
          set -o pipefail
          npm test 2>&1 | tee cadp-verify-output.txt
          total="$(grep -E '^# tests [0-9]+$' cadp-verify-output.txt | tail -n 1 | awk '{ print $3 }')"
          if [ -z "$total" ] || [ "$total" -eq 0 ]; then
            echo "::error::verification executed ${total:-no} tests — a verifier that ran nothing must never report success"
            exit 1
          fi
          echo "verification executed $total tests"

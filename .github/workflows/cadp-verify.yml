# CADP external verification backend (#57).
#
# Authority boundary (issue #57): GitHub Actions is an EVIDENCE SOURCE, never a lifecycle
# authority. A green check here transitions nothing by itself — the broker reads the check-run
# result for the exact candidate sha, the activity submits it as VERIFICATION evidence produced
# by `verifier:github-actions`, and the deployment policy decides sufficiency
# (`require_external_verification`). Workers get no GitHub credentials for this: the workflow is
# repository-owned and triggers on the governed candidate-branch push that already happened.
name: cadp-verify
on:
  push:
    branches:
      - "cadp/candidate/**"
jobs:
  verify:
    name: cadp-verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # The pinned invocation below names DIRECTORIES, which only a Node whose test runner
          # searches directory arguments expands into test files (measured: Node 22 does not — it
          # tries to load each directory as a module). This runner is therefore kept on 24.
          node-version: "24"
      # The conformance suite drives a real OPA evaluator; pin the SAME version the deployment's
      # evaluator integrity records (1.20.1). Without it the suite stalls to the job timeout
      # (measured live, 16th pilot: npm test cancelled at 10m, check-run conclusion=cancelled).
      - run: |
          curl -fsSL -o /usr/local/bin/opa https://openpolicyagent.org/downloads/v1.20.1/opa_linux_amd64_static
          chmod +x /usr/local/bin/opa
          opa version
      - run: npm ci --ignore-scripts
      # The PINNED test selection — byte-identical to `VERIFIER_TEST_ARGV` in
      # cadp/product/surfaceBroker.ts, which the LOCAL verifier runs. Both verifiers name the same
      # THREE leaf directories, and the invocation contract is that every test file lives DIRECTLY
      # in one of them (asserted by cadp/tests/conformance/conformance-manifest.test.ts):
      # cadp/tests/conformance/ (gate-protected), cadp/tests/ops/ and devharness/tests/ (not
      # protected — but all three EXECUTE here, exactly as the previous bare `npm test` ran them).
      #
      # NOT `npm test`: package.json is an ordinary delegable file, so while it was the verifier's
      # seam a candidate could drop a conformance suite from the executed set without editing one
      # protected byte. `npm test` remains a developer convenience and is no longer any verifier's
      # seam. The selector form is EXACT — `--test` plus the three leaf directory paths, trailing
      # slashes, no glob character and no `--test-*` pattern flag — so the tokens here are the
      # tokens of `VERIFIER_TEST_ARGV`, and nothing is left for a shell to expand.
      - run: node --test cadp/tests/conformance/ cadp/tests/ops/ devharness/tests/

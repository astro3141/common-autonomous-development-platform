# Routing-layer Grok config (#281). Lives at $GROK_HOME/config.toml = /route/grok/config.toml,
# outside the /ws workspace so the filesystem MCP server cannot rewrite it.
#
# Create the MCP entry with the CLI rather than by hand (it writes the header for you):
#   GROK_HOME=/route/grok grok mcp add preloop http://console/mcp/v1 --transport http \
#     --scope user --header "Authorization: Bearer <preloop MCP bearer — never commit>"
# then append the sections below.

# Native write / shell / web removed; file work only through the Preloop MCP server, where
# Preloop rules decide. Note the section name is [permission] (singular) — [permissions] is
# silently ignored.
[permission]
deny  = ["Bash", "Edit", "Write", "WebFetch", "WebSearch"]
allow = ["MCPTool(preloop__*)"]

[ui]
remember_tool_approvals = false

# CADP external verification backend (#57).
#
# Authority boundary (issue #57): GitHub Actions is an EVIDENCE SOURCE, never a lifecycle
# authority. A green check here transitions nothing by itself — the broker reads the check-run
# result for the exact candidate sha, the activity submits it as VERIFICATION evidence produced
# by `verifier:github-actions`, and the deployment policy decides sufficiency
# (`require_external_verification`). Workers get no GitHub credentials for this: the workflow is
# repository-owned and triggers on the governed candidate-branch push that already happened.
name: cadp-verify
on:
  push:
    branches:
      - "cadp/candidate/**"
jobs:
  verify:
    name: cadp-verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      # The conformance suite drives a real OPA evaluator; pin the SAME version the deployment's
      # evaluator integrity records (1.20.1). Without it the suite stalls to the job timeout
      # (measured live, 16th pilot: npm test cancelled at 10m, check-run conclusion=cancelled).
      - run: |
          curl -fsSL -o /usr/local/bin/opa https://openpolicyagent.org/downloads/v1.20.1/opa_linux_amd64_static
          chmod +x /usr/local/bin/opa
          opa version
      - run: npm ci --ignore-scripts
      # The PROTECTED verifier invocation, kept identical to the local verifier's argv
      # (`VERIFIER_TEST_ARGV`, cadp/product/surfaceBroker.ts): node DIRECTLY, never `npm test`.
      # package.json's `test` script stays as a developer convenience, but it is no longer any
      # verifier's seam — package.json is not gate machinery, so a candidate could rewrite that one
      # line and change what "verified" means without a Human seeing it. This workflow file IS gate
      # machinery (cadp/product/gateFiles.ts), and so is the broker that runs the same argv locally.
      #
      # BARE — no positional selectors, no glob, no --test-* pattern flag. Directory positionals were
      # measured broken for .ts discovery on the surface image's Node 22 (the path resolves as a
      # module entry point: `Cannot find module`, one failing pseudo-test per positional, no suite
      # actually run), while recursive default discovery finds every *.test.ts. All three test
      # directories — cadp/tests/conformance/, cadp/tests/ops/, devharness/tests/ — run here, exactly
      # as before the split: the split changes protection, never execution coverage. A future runtime
      # upgrade may make the explicit-path form work; revisiting is then a conscious, measured choice.
      #
      # ZERO-DISCOVERY GUARD. Measured (Node 22): a run that discovers NO test files prints
      # `# tests 0` and EXITS 0, so this job's exit status alone can never catch an invocation that
      # silently ran nothing — the summary must be read. `pipefail` keeps a genuine suite failure
      # fatal through the tee.
      - name: conformance + ops suites (protected invocation)
        run: |
          set -o pipefail
          node --test | tee /tmp/cadp-node-test.out
          grep -Eq '^(# |ℹ )tests [1-9][0-9]*$' /tmp/cadp-node-test.out \
            || { echo "::error::zero tests executed — the verifier discovered nothing, so it verified nothing"; exit 1; }

# CADP external verification backend (#57).
#
# Authority boundary (issue #57): GitHub Actions is an EVIDENCE SOURCE, never a lifecycle
# authority. A green check here transitions nothing by itself — the broker reads the check-run
# result for the exact candidate sha, the activity submits it as VERIFICATION evidence produced
# by `verifier:github-actions`, and the deployment policy decides sufficiency
# (`require_external_verification`). Workers get no GitHub credentials for this: the workflow is
# repository-owned and triggers on the governed candidate-branch push that already happened.
name: cadp-verify
on:
  push:
    branches:
      - "cadp/candidate/**"
jobs:
  verify:
    name: cadp-verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      # The conformance suite drives a real OPA evaluator; pin the SAME version the deployment's
      # evaluator integrity records (1.20.1). Without it the suite stalls to the job timeout
      # (measured live, 16th pilot: npm test cancelled at 10m, check-run conclusion=cancelled).
      - run: |
          curl -fsSL -o /usr/local/bin/opa https://openpolicyagent.org/downloads/v1.20.1/opa_linux_amd64_static
          chmod +x /usr/local/bin/opa
          opa version
      - run: npm ci --ignore-scripts
      # The EXTERNAL verifier's executed set, pinned here (the selection-bypass seam, closed).
      #
      # A conformance test must not be evadable by EXCLUSION WITHOUT MODIFICATION: leaving a
      # control's file untouched — so no reviewer sees a diff to it — while quietly arranging that
      # the verifier never runs it. `npm test` was exactly that seam: `package.json` is an ORDINARY,
      # delegable file, so a candidate could narrow the script and disarm a control without editing
      # one protected byte. This step therefore spawns `node --test` with the explicit path, and
      # this workflow file is listed in `cadp/product/gateFiles.ts` — external-verifier invocation
      # is verification machinery, so any change to it routes to a HUMAN_DECISION.
      #
      # `package.json`'s `test` script survives as a DEVELOPER CONVENIENCE ONLY. It is no longer any
      # verifier's seam — the local verifier (`cadp/product/surfaceBroker.ts`, `VERIFIER_TEST_ARGV`)
      # pins the identical invocation.
      #
      # The pinned path is the tests ROOT, not the protected subdirectory: `cadp/tests/conformance/`
      # and `cadp/tests/ops/` both keep running. The split changed PROTECTION, never coverage.
      #
      # The path is the bare directory — NOT a glob (owner decision, reviewer-confirmed). It carries
      # no shell metacharacter, so nothing here is quoted and nothing is expanded by the step's shell
      # before node sees it; the executed set is exactly the directory named in this protected file.
      # This requires a runner whose `node --test` recurses a directory argument, which is why the
      # `node-version` pinned above is the one this step is measured against.
      - run: node --test cadp/tests/

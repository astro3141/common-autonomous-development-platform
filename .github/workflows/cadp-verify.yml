# CADP external verification backend (#57).
#
# Authority boundary (issue #57): GitHub Actions is an EVIDENCE SOURCE, never a lifecycle
# authority. A green check here transitions nothing by itself — the broker reads the check-run
# result for the exact candidate sha, the activity submits it as VERIFICATION evidence produced
# by `verifier:github-actions`, and the deployment policy decides sufficiency
# (`require_external_verification`). Workers get no GitHub credentials for this: the workflow is
# repository-owned and triggers on the governed candidate-branch push that already happened.
name: cadp-verify
on:
  push:
    branches:
      - "cadp/candidate/**"
jobs:
  verify:
    name: cadp-verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      # The conformance suite drives a real OPA evaluator; pin the SAME version the deployment's
      # evaluator integrity records (1.20.1). Without it the suite stalls to the job timeout
      # (measured live, 16th pilot: npm test cancelled at 10m, check-run conclusion=cancelled).
      - run: |
          curl -fsSL -o /usr/local/bin/opa https://openpolicyagent.org/downloads/v1.20.1/opa_linux_amd64_static
          chmod +x /usr/local/bin/opa
          opa version
      - run: npm ci --ignore-scripts
      # Protected invocation — the EXTERNAL half of the pin. The executed set is enumerated here by
      # explicit path, byte-identically with VERIFIER_TEST_ARGV in cadp/product/surfaceBroker.ts
      # (the local verifier), so a candidate cannot narrow the suite by exclusion-without-
      # modification: both invocation sites are gate-protected files (GATE_PATH_RULES lists this
      # workflow and surfaceBroker.ts), so changing either routes to a HUMAN_DECISION.
      #
      # `npm test` is NOT used here any more. package.json's `test` script remains as a developer
      # convenience, but it is no verifier's seam — it is an ordinary delegable file.
      #
      # Three LEAF directories: cadp/tests/conformance/ (gate-protected), cadp/tests/ops/ and
      # devharness/tests/ (not protected, still run — the split changes protection, never coverage).
      # Discovery does not descend into subdirectories, so every test file must live DIRECTLY in one
      # of the three; cadp/tests/conformance/conformance-manifest.test.ts (CM4) asserts exactly that.
      # No globs, no --test-* pattern flags: the set is enumerated, not matched.
      - run: node --test cadp/tests/conformance/ cadp/tests/ops/ devharness/tests/

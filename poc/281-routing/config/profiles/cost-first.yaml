name: cost-first
description: Cheapest first — Codex, then Grok, then Claude (Claude used ~4x the tokens on the same task).

providers:
  - {name: codex, route: direct, login: codex}
  - {name: grok, route: direct, login: grok}
  - {name: claude, route: direct, login: claude}

quota:
  max_age_s: 1800
  require_windows: [weekly]
  max_used_percent: {session: 80, weekly: 90}

tools:
  native_tools: false
  preloop_policy: policy/b-fsmcp.yaml

execution:
  timeout_ms: 600000

record:
  mlflow_experiment: p281-routing

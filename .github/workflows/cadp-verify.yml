# CADP external verification backend (#57).
#
# Authority boundary (issue #57): GitHub Actions is an EVIDENCE SOURCE, never a lifecycle
# authority. A green check here transitions nothing by itself — the broker reads the check-run
# result for the exact candidate sha, the activity submits it as VERIFICATION evidence produced
# by `verifier:github-actions`, and the deployment policy decides sufficiency
# (`require_external_verification`). Workers get no GitHub credentials for this: the workflow is
# repository-owned and triggers on the governed candidate-branch push that already happened.
name: cadp-verify
on:
  push:
    branches:
      - "cadp/candidate/**"
jobs:
  verify:
    name: cadp-verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      # The conformance suite drives a real OPA evaluator; pin the SAME version the deployment's
      # evaluator integrity records (1.20.1). Without it the suite stalls to the job timeout
      # (measured live, 16th pilot: npm test cancelled at 10m, check-run conclusion=cancelled).
      - run: |
          curl -fsSL -o /usr/local/bin/opa https://openpolicyagent.org/downloads/v1.20.1/opa_linux_amd64_static
          chmod +x /usr/local/bin/opa
          opa version
      - run: npm ci --ignore-scripts
      # EXTERNAL verifier's executed set, pinned by explicit path — byte-identical to the LOCAL
      # verifier's `VERIFIER_TEST_ARGV` (cadp/product/surfaceBroker.ts), and asserted equal by GF8.
      #
      # NOT `npm test`: that resolves through package.json, which is not gate machinery, so a
      # candidate could narrow what this job runs — drop a whole suite from the executed set —
      # without modifying a protected file or a test. package.json's `test` script stays as a
      # developer convenience and is no longer any verifier's seam.
      #
      # INVOCATION CONTRACT: all test files live DIRECTLY in a named leaf directory. Nothing
      # recurses; every directory is named. The meta-test (conformance-manifest.test.ts, MF4)
      # refuses a *.test.ts nested any deeper under cadp/tests/, since neither verifier would run
      # it. Both cadp suites run here — the conformance/ops split changes protection
      # (gateFiles.ts), never execution coverage. devharness/tests/ is named for coverage PARITY:
      # it is not a platform component and not gate machinery, but the bare `node --test` behind
      # `npm test` recursed into it, and this pin must not narrow the executed set.
      #
      # The globs are QUOTED so node's test runner expands them, not the shell: that keeps this argv
      # byte-identical to the local verifier's, and it is the form that works on the surface image's
      # Node 22, where a bare DIRECTORY argument to `node --test` is resolved as a module specifier
      # and runs no suite at all.
      - run: node --test 'cadp/tests/conformance/*.test.ts' 'cadp/tests/ops/*.test.ts' 'devharness/tests/*.test.ts'

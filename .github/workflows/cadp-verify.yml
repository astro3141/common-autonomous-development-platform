# CADP external verification backend (#57).
#
# Authority boundary (issue #57): GitHub Actions is an EVIDENCE SOURCE, never a lifecycle
# authority. A green check here transitions nothing by itself — the broker reads the check-run
# result for the exact candidate sha, the activity submits it as VERIFICATION evidence produced
# by `verifier:github-actions`, and the deployment policy decides sufficiency
# (`require_external_verification`). Workers get no GitHub credentials for this: the workflow is
# repository-owned and triggers on the governed candidate-branch push that already happened.
name: cadp-verify
on:
  push:
    branches:
      - "cadp/candidate/**"
jobs:
  verify:
    name: cadp-verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      # The conformance suite drives a real OPA evaluator; pin the SAME version the deployment's
      # evaluator integrity records (1.20.1). Without it the suite stalls to the job timeout
      # (measured live, 16th pilot: npm test cancelled at 10m, check-run conclusion=cancelled).
      - run: |
          curl -fsSL -o /usr/local/bin/opa https://openpolicyagent.org/downloads/v1.20.1/opa_linux_amd64_static
          chmod +x /usr/local/bin/opa
          opa version
      - run: npm ci --ignore-scripts
      # Zero-discovery guard — the external verifier's half of the same protection the local
      # verifier gets from `parseExecutedTestCount()` in `cadp/product/surfaceBroker.ts`.
      #
      # MEASURED (Node v22.23.2, the LOCAL verifier's surface-image runtime): a `node --test` run
      # that discovers NO test files prints `# tests 0` and EXITS 0. Exit status alone therefore
      # cannot tell "the suite passed" from "nothing ran". This job pins Node 24, on which that
      # exit-status behaviour is UNMEASURED here — the assertion below deliberately does not depend
      # on it: it reads the runner's own summary, the same TAP line on both runtimes.
      #
      # MEASURED, UNRESOLVED (same runtime): on Node 22 a positional DIRECTORY argument to `--test`
      # is not expanded — it is loaded as an entry module, so the enumeration below yields one
      # failing `ERR_MODULE_NOT_FOUND` pseudo-test per directory and runs ZERO real tests (exit 1,
      # `# tests 3`). Loud, never a false pass, but on Node 22 it is a verdict about the runtime,
      # not the candidate. Node 24 is UNMEASURED here (none was obtainable in the authoring
      # container). The same note sits on `VERIFIER_TEST_ARGV` in `surfaceBroker.ts`, whose surface
      # image IS Node 22; resolving it is a routing decision, not a local edit — substituting a
      # glob or bumping the image would be a silent workaround of the pinned invocation form.
      #
      # NOTE ON THE SEAM: `package.json`'s `test` script stays as a developer convenience, but it
      # is no longer any verifier's seam. The runner is spawned DIRECTLY below with the same
      # explicit enumeration `VERIFIER_TEST_ARGV` pins in `cadp/product/surfaceBroker.ts`, so
      # re-pointing the npm script cannot change what verification executes. The three leaf
      # directories are byte-identical to that array (modulo this file's yml quoting): directory
      # paths with trailing slashes, NO globs, no `--test-*` pattern flag. The invocation contract
      # is "every test file lives DIRECTLY in one of the three named directories" — MM4 in
      # `cadp/tests/conformance/conformance-manifest.test.ts` fails if any file nests out of it.
      # Both protection tiers keep RUNNING here (conformance/ + ops/ + devharness/): the directory
      # split changed which files are gate-protected, never which files are executed.
      - run: |
          set -o pipefail
          node --test cadp/tests/conformance/ cadp/tests/ops/ devharness/tests/ 2>&1 | tee cadp-verify-output.txt
          total="$(grep -E '^# tests [0-9]+$' cadp-verify-output.txt | tail -n 1 | awk '{ print $3 }')"
          if [ -z "$total" ] || [ "$total" -eq 0 ]; then
            echo "::error::verification executed ${total:-no} tests — a verifier that ran nothing must never report success"
            exit 1
          fi
          echo "verification executed $total tests"

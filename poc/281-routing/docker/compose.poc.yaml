# #278 PoC — governed runtime, isolated from the host's daily Claude installation.
#
# #281 layout: this file sits in poc/281-routing/docker; relative bind sources resolve against
# this directory, so /work in the agent is poc/281-routing/ in a fresh clone.
#
# Network design (per review):
#   governed  : internal, NO route to the internet. The agent lives here only.
#   provision : ordinary bridge, attached TEMPORARILY for credential minting only.
#
# The Preloop containers (api / console / gateway) are attached to `governed` out of
# band with `docker network connect`, because they are owned by the upstream release
# compose in ~/.preloop-oss and are not redefined here.
name: cadp278

networks:
  # UX track: the ops API's own network (nothing else joins it; the UI will).
  opsnet:
    name: cadp278-opsnet
  # #281 option B: internet side of the routing layer's allowlist proxy.
  egressnet:
    name: cadp278-egressnet
  # #281 quota observer: ordinary bridge (egress) for the observer ONLY. The agent is never on
  # it; observations reach the agent through a read-only volume, not over the network.
  quotanet:
    name: cadp278-quotanet
  governed:
    name: cadp278-governed
    internal: true
  provision:
    name: cadp278-provision
  # Inbound-only path for the operator's browser to reach MLflow. Measured:
  # a published port does NOT work on an `internal: true` network in this Docker
  # version (docker port reports no mapping), so MLflow is dual-homed here.
  # This grants egress to MLFLOW ONLY. The agent stays single-homed on `governed`,
  # and no container runs a forwarder or proxy, so this does not give the agent a
  # route out. Recorded in FINDINGS.md F9.
  observe:
    name: cadp278-observe
  # The underlying MCP tool lives here. The agent is deliberately NOT a member,
  # so the only route from the agent to the tool is through Preloop's MCP safety
  # layer. Preloop's api container is attached out of band.
  toolnet:
    name: cadp278-toolnet
    internal: true

volumes:
  agent-home:
    name: cadp278-agent-home
  # #281 option B: the workspace the agent works in, also mounted (same path) in fsmcp so
  # file tools served over MCP act on the same files.
  ws:
    name: cadp278-ws
  # #281 quota observer: its own credentials (a separate login lineage), and the observation
  # files it writes (mounted read-only in the agent).
  quota-home:
    name: cadp278-quota-home
  # #281 option B: the routing layer's own provider logins (a lineage separate from the
  # credentials Preloop custodies), mounted in the agent at /route.
  route-creds:
    name: cadp278-route-creds
  quota-obs:
    name: cadp278-quota-obs

services:
  agent:
    build:
      context: .
      dockerfile: agent.Dockerfile
    image: cadp278/governed-runtime:local
    container_name: cadp278-agent
    restart: unless-stopped
    networks:
      - governed
    volumes:
      # The PoC workspace, shared with the host so evidence stays inspectable.
      - type: bind
        source: ${POC_HOST_DIR:-..}
        target: /work
      # The #280 research workspace, kept separate from the PoC workspace.
      - type: bind
        source: ${RESEARCH_HOST_DIR:-../evidence/research}
        target: /research
      # Container-only HOME. The host's ~/.claude is NEVER mounted here.
      - agent-home:/home/agent
      - ws:/ws
      - quota-obs:/obs:ro
      - route-creds:/route
    environment:
      POC_DIR: /work
      POC_PY: /opt/venv/bin/python
      PYTHONUTF8: "1"
      # Preloop control plane, reached over the governed network by service name.
      PRELOOP_URL: http://console
      # Traces go to the in-network MLflow, not the host.
      OTEL_EXPORTER_OTLP_ENDPOINT: http://mlflow:5000
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_EXPORTER_OTLP_HEADERS: x-mlflow-experiment-id=1
      OTEL_SERVICE_NAME: cadp-commodity-composition-poc
    command: ["sleep", "infinity"]

  mlflow:
    build:
      context: .
      dockerfile: mlflow.Dockerfile
    image: cadp278/mlflow:3.16.1
    container_name: cadp278-mlflow
    restart: unless-stopped
    networks:
      - governed
      - observe
    volumes:
      - type: bind
        source: ${POC_HOST_DIR:-..}/evidence/mlflow
        target: /mlflow
    environment:
      # MLflow rejects Host headers outside localhost/private-IP by default
      # (DNS-rebinding protection). In-network clients address it as `mlflow:5000`,
      # so that name has to be allowed explicitly. Measured: without this, OTLP
      # ingest answers 403 "Invalid Host header".
      MLFLOW_SERVER_ALLOWED_HOSTS: "mlflow,mlflow:5000,localhost,localhost:5000,127.0.0.1,127.0.0.1:5000"
    ports:
      # Inbound only. Publishing a port does not give any container egress,
      # so this does not weaken the N7 claim.
      - "127.0.0.1:5000:5000"
    command: >
      mlflow server --host 0.0.0.0 --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --artifacts-destination /mlflow/artifacts

  toolsvc:
    build:
      context: .
      dockerfile: toolsvc.Dockerfile
    image: cadp278/toolsvc:local
    container_name: cadp278-toolsvc
    restart: unless-stopped
    networks:
      - toolnet
    volumes:
      - type: bind
        source: ${POC_HOST_DIR:-..}/evidence/n1-markers
        target: /markers

  # #281 option B: filesystem MCP behind Preloop. On toolnet only: the agent cannot reach it
  # except through Preloop's MCP proxy, which is where the rules are evaluated.
  fsmcp:
    build:
      context: .
      dockerfile: fsmcp.Dockerfile
    image: cadp278/fsmcp:local
    container_name: cadp278-fsmcp
    restart: unless-stopped
    networks:
      - toolnet
    volumes:
      - ws:/ws

  # #281 quota observer. Same image (codex, CodexBar), different network, volume and logins.
  # Holds provider credentials and has egress, so it runs no service and joins no network the
  # agent is on; it only writes observation files into quota-obs.
  quota:
    image: cadp278/governed-runtime:local
    container_name: cadp278-quota
    restart: unless-stopped
    networks:
      - quotanet
    volumes:
      - quota-home:/home/agent
      - quota-obs:/obs
      - type: bind
        source: ${POC_HOST_DIR:-..}/p281/observer_loop.sh
        target: /opt/p281/observer_loop.sh
        read_only: true
    # the observation loop is the container's process, so it comes back with every restart
    command: ["sh", "/opt/p281/observer_loop.sh"]

  # #281 option B: the routing layer's egress — allowlisted provider hosts only.
  egress:
    build:
      context: .
      dockerfile: egress.Dockerfile
    image: cadp278/egress:local
    container_name: cadp278-egress
    restart: unless-stopped
    networks:
      governed:
        aliases: [egress]
      egressnet: {}

  # UX track: the only component with Docker control — a fixed set of actions over HTTP.
  # Published on 127.0.0.1 only, which narrows who can reach it, not what it can do.
  ops:
    build:
      context: ..
      dockerfile: docker/ops.Dockerfile
    image: cadp278/ops:local
    container_name: cadp278-ops
    restart: unless-stopped
    networks:
      - opsnet
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      OPS_AGENT_CONTAINER: cadp278-agent
    ports:
      - "127.0.0.1:8781:8781"

  # UX track: the UI. Talks only to the ops API; holds no Docker access and no credentials.
  hub:
    build:
      context: ..
      dockerfile: docker/hub.Dockerfile
    image: cadp278/hub:local
    container_name: cadp278-hub
    restart: unless-stopped
    networks:
      - opsnet
    environment:
      HUB_OPS_URL: http://cadp278-ops:8781
    ports:
      - "127.0.0.1:8780:8780"

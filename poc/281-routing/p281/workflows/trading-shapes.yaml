# Capability trial B2 — one cycle, one lane per *decision shape*.
#
# The paper-trading harness (Notion) runs lanes A–I. Several of them are the same shape as far as
# an execution layer is concerned — A and B are both deterministic, C is D without its second
# overlay, G is E with different input — so this trial runs one lane per distinct shape:
#
#   B  deterministic rules, no model call at all            (covers A)
#   D  deterministic base + MI overlay + risk critic        (covers C; a chain of two calls)
#   E  one call decides the whole portfolio
#   F  a desk: analyst → risk review → portfolio manager    (a chain of three calls)
#   H  forecast → deterministic scoring → decision          (a deterministic step *inside* a lane)
#   I  screen → thesis → review, on a longer horizon        (a research pipeline)
#
# Nothing of that project is imported: the packet is a fixture with invented numbers and no market
# data is touched. What is being tried is whether this stack can express these shapes at once —
# chains inside a lane, a deterministic step between two model calls, and isolation between lanes
# that are not alike.
#
#   conductor run p281/workflows/trading-shapes.yaml -i profile=research-default
workflow:
  name: p281-trading-shapes
  description: One lane per decision shape, decided together from one frozen packet
  entry_point: route
  input:
    profile:
      type: string
      required: false
      default: research-default
      description: execution profile (config/profiles/<name>.yaml)
  limits:
    max_iterations: 30
    timeout_seconds: 5400

agents:
  - name: route
    type: script
    description: Quota admission for the cycle
    command: "${POC_PY:-/opt/venv/bin/python}"
    args: ["/work/p281/steps/route.py", "{{ workflow.input.profile }}"]
    output:
      decision: {type: string}
      provider: {type: string}
      reason: {type: string}
      profile: {type: string}
      evidence_dir: {type: string}
    routes:
      - to: roles
        when: "{{ route.output.decision == 'ROUTE' }}"
      - to: record_hold

  - name: roles
    type: script
    description: Bind the lanes to vendors the router admitted
    command: "${POC_PY:-/opt/venv/bin/python}"
    args: ["/work/p281/steps/roles.py", "{{ route.output.profile }}", "{{ route.output.evidence_dir }}",
           "ai=codex", "ai2=claude", "ai3=grok"]
    output:
      ok: {type: string}
      missing: {type: string}
      ineligible: {type: string}
      ai_provider: {type: string}
      ai_login: {type: string}
      ai_route: {type: string}
      ai2_provider: {type: string}
      ai2_login: {type: string}
      ai2_route: {type: string}
      ai3_provider: {type: string}
      ai3_login: {type: string}
      ai3_route: {type: string}
    routes:
      - to: packet
        when: "{{ roles.output.ok == 'yes' }}"
      - to: record_hold

  - name: packet
    type: script
    description: Freeze the cycle's input packet (built twice, hashes compared)
    command: "${POC_PY:-/opt/venv/bin/python}"
    args: ["/work/p281/steps/trade_stage.py", "packet"]
    output:
      status: {type: string}
      workspace: {type: string}
      packet_sha256: {type: string}
      deterministic: {type: string}
      symbols: {type: number}
    routes:
      - to: baseline

  # Lane B: the deterministic shape. No model call, so it is this workflow's own step.
  - name: baseline
    type: script
    description: Lane B — fixed momentum rules, 0 model calls
    command: "${POC_PY:-/opt/venv/bin/python}"
    args: ["/work/p281/steps/trade_stage.py", "baseline", "B"]
    output:
      status: {type: string}
      lane: {type: string}
      positions: {type: number}
      model_calls: {type: number}
    routes:
      - to: plan

  # Which steps each shape is made of is this workflow's knowledge, so it writes the plan.
  - name: plan
    type: script
    description: The lane plan — one member per shape, vendors spread across the three logins
    command: "${POC_PY:-/opt/venv/bin/python}"
    args: ["/work/p281/steps/trade_stage.py", "shapes-plan",
           "D:{{ roles.output.ai_provider }}:{{ roles.output.ai_login }}:{{ roles.output.ai_route }}",
           "E:{{ roles.output.ai3_provider }}:{{ roles.output.ai3_login }}:{{ roles.output.ai3_route }}",
           "F:{{ roles.output.ai_provider }}:{{ roles.output.ai_login }}:{{ roles.output.ai_route }}",
           "H:{{ roles.output.ai2_provider }}:{{ roles.output.ai2_login }}:{{ roles.output.ai2_route }}",
           "I:{{ roles.output.ai2_provider }}:{{ roles.output.ai2_login }}:{{ roles.output.ai2_route }}"]
    output:
      status: {type: string}
      plan: {type: string}
      members: {type: number}
      model_steps: {type: number}
      script_steps: {type: number}
    routes:
      - to: lanes

  # The platform runs the plan: members at the same time, each member's steps in order.
  - name: lanes
    type: script
    description: Five shapes decided together from the frozen packet
    command: "${POC_PY:-/opt/venv/bin/python}"
    args: ["/work/p281/steps/tasks.py", "lanes_round.json", "{{ packet.output.packet_sha256 }}",
           "{{ route.output.profile }}", "--plan", "{{ plan.output.plan }}"]
    timeout: 3600
    output:
      status: {type: string}
      receipt: {type: string}
      tasks: {type: number}
      produced: {type: number}
      model_calls: {type: number}
      failed: {type: string}
      wall_s: {type: number}
      busy_s: {type: number}
      overlap: {type: number}
      detail: {type: string}
    routes:
      - to: evaluate

  - name: evaluate
    type: script
    description: Validate every lane the same way and score them against held-back returns
    command: "${POC_PY:-/opt/venv/bin/python}"
    args: ["/work/p281/steps/trade_stage.py", "evaluate"]
    output:
      status: {type: string}
      lanes: {type: number}
      valid: {type: number}
      invalid: {type: string}
      best_lane: {type: string}
      best_ret: {type: string}
      packet_sha256: {type: string}
      report: {type: string}
    routes:
      - to: record_cycle

  - name: record_cycle
    type: script
    description: Record the cycle and every call each lane made
    command: "${POC_PY:-/opt/venv/bin/python}"
    args: ["/work/p281/steps/record.py"]
    stdin: "{{ {'receipts': [lanes.output.receipt], 'measurements': {'valid_lanes': evaluate.output.valid, 'lane_wall_s': lanes.output.wall_s, 'lane_overlap': lanes.output.overlap, 'model_calls': lanes.output.model_calls}, 'check': {'decision': 'CYCLE', 'reason': 'best ' + evaluate.output.best_lane + ' ret ' + evaluate.output.best_ret, 'file_sha256': evaluate.output.packet_sha256}, 'route': route.output} | tojson }}"
    output:
      mlflow_run_id: {type: string}
      experiment_id: {type: string}
      executions: {type: number}
      children: {type: number}
      record_error: {type: string}
    routes:
      - to: done_cycle
        when: "{{ evaluate.output.valid > 0 }}"
      - to: done_no_lane

  - name: record_hold
    type: script
    description: Record a cycle the router held
    command: "${POC_PY:-/opt/venv/bin/python}"
    args: ["/work/p281/steps/record.py"]
    stdin: "{{ {'route': route.output} | tojson }}"
    output:
      mlflow_run_id: {type: string}
      experiment_id: {type: string}
      executions: {type: number}
      children: {type: number}
      record_error: {type: string}
    routes:
      - to: done_hold

  - name: done_cycle
    type: terminate
    status: success
    reason: "CYCLE: {{ evaluate.output.valid }}/{{ evaluate.output.lanes }} lanes valid, best {{ evaluate.output.best_lane }}"

  - name: done_no_lane
    type: terminate
    status: failed
    reason: "no lane produced a valid proposal (invalid: {{ evaluate.output.invalid }})"

  - name: done_hold
    type: terminate
    status: failed
    reason: "HOLD: {{ route.output.reason }} {{ roles.output.missing }} {{ roles.output.ineligible }}"

output:
  profile: "{{ route.output.profile }}"
  route: "{{ route.output.decision }}: {{ route.output.reason }}"
  shapes: "{% if lanes is defined %}{{ lanes.output.tasks }}{% endif %}"
  shapes_produced: "{% if lanes is defined %}{{ lanes.output.produced }}{% endif %}"
  failed_shapes: "{% if lanes is defined %}{{ lanes.output.failed }}{% endif %}"
  model_calls: "{% if lanes is defined %}{{ lanes.output.model_calls }}{% endif %}"
  lane_overlap: "{% if lanes is defined %}{{ lanes.output.overlap }}{% endif %}"
  lane_wall_s: "{% if lanes is defined %}{{ lanes.output.wall_s }}{% endif %}"
  lanes_evaluated: "{% if evaluate is defined %}{{ evaluate.output.lanes }}{% endif %}"
  valid: "{% if evaluate is defined %}{{ evaluate.output.valid }}{% endif %}"
  invalid: "{% if evaluate is defined %}{{ evaluate.output.invalid }}{% endif %}"
  best_lane: "{% if evaluate is defined %}{{ evaluate.output.best_lane }}{% endif %}"
  best_ret: "{% if evaluate is defined %}{{ evaluate.output.best_ret }}{% endif %}"
  packet_sha256: "{% if packet is defined %}{{ packet.output.packet_sha256 }}{% endif %}"
  report: "{% if evaluate is defined %}{{ evaluate.output.report }}{% endif %}"
  recorded_executions: "{% if record_cycle is defined %}{{ record_cycle.output.children }}{% endif %}"
  mlflow_run_id: "{% if record_cycle is defined %}{{ record_cycle.output.mlflow_run_id }}{% elif record_hold is defined %}{{ record_hold.output.mlflow_run_id }}{% endif %}"
  record_error: "{% if record_cycle is defined %}{{ record_cycle.output.record_error }}{% elif record_hold is defined %}{{ record_hold.output.record_error }}{% endif %}"
